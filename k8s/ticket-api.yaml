apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api
  namespace: concertpass
spec:
  replicas: 2
  selector:
    matchLabels: { app: ticket-api }
  template:
    metadata:
      labels: { app: ticket-api }
    spec:
      serviceAccountName: ticket-api
      containers:
        - name: ticket-api
          image: REPLACE_IMAGE
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: runtime-config }
            - secretRef: { name: database }
          startupProbe: { tcpSocket: { port: http }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-api
  namespace: concertpass
spec:
  type: NodePort
  selector: { app: ticket-api }
  ports: [{ name: http, port: 80, targetPort: http, nodePort: 30080 }]
